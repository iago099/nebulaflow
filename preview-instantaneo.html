      function isDateOverdue(dateStr) {
        if (!dateStr) return false;
        const today = new Date();

        return new Date(y, m - 1, d) < today;

      function useLocalStorage(key, initialValue) {
        const [storedValue, setStoredValue] = useState(() => {
          try {
            const item = window.localStorage.getItem(key);
            return item ? JSON.parse(item) : initialValue;
          } catch {
            return initialValue;
          }
        });

        useEffect(() => {
          try {
            window.localStorage.setItem(key, JSON.stringify(storedValue));
          } catch {}
        }, [key, storedValue]);

        return [storedValue, setStoredValue];
      }

              )}
            </div>

        );

      // ==========================================
      // MODAL DETALHADO DO CARTÃO
      // ==========================================
      function CardModal({
        card,
        columnTitle,
        members,
        availableLabels,
        onCreateLabel,
        onDeleteLabel,
        onOpenTeamModal,
        onClose,
        onUpdateCard,
        onDeleteCard,

        const [showCustomLabelForm, setShowCustomLabelForm] = useState(false);

        if (!card) return null;

        const totalCheck = card.checklist.length;
        const doneCheck = card.checklist.filter((i) => i.completed).length;
        const progressPct = totalCheck > 0 ? Math.round((doneCheck / totalCheck) * 100) : 0;

        const toggleLabel = (label) => {
          const exists = card.labels.some((l) => l.id === label.id);
          const updatedLabels = exists
            ? card.labels.filter((l) => l.id !== label.id)
            : [...card.labels, label];
          onUpdateCard({ ...card, labels: updatedLabels });

        const handleAddCustomLabel = (e) => {
          if (e) e.preventDefault();
          if (!customLabelName.trim()) return;
          const newLabel = {
            id: `lbl-custom-${Date.now()}`,
            name: customLabelName.trim(),
            color: customLabelColor,
          };
          onCreateLabel(newLabel);
          onUpdateCard({ ...card, labels: [...card.labels, newLabel] });
          setCustomLabelName('');
          setShowCustomLabelForm(false);
        };

        const toggleMember = (memberId) => {
          const exists = card.memberIds.includes(memberId);
          const updatedMembers = exists
            ? card.memberIds.filter((id) => id !== memberId)
            : [...card.memberIds, memberId];
          onUpdateCard({ ...card, memberIds: updatedMembers });
        };

        const handleAddChecklistItem = (e) => {
          e.preventDefault();
          if (!newCheckText.trim()) return;
          const newItem = {
            id: `chk-${Date.now()}`,
            text: newCheckText.trim(),
            completed: false,
          };
          onUpdateCard({ ...card, checklist: [...card.checklist, newItem] });
          setNewCheckText('');

        const toggleChecklistItem = (itemId) => {
          const updated = card.checklist.map((item) =>
            item.id === itemId ? { ...item, completed: !item.completed } : item
          );
          onUpdateCard({ ...card, checklist: updated });

                initial={{ opacity: 0, scale: 0.93, y: 20 }}
                animate={{ opacity: 1, scale: 1, y: 0 }}
                exit={{ opacity: 0, scale: 0.93, y: 20 }}
                transition={{ type: 'spring', stiffness: 320, damping: 28 }}

              >
                <div className="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-purple-600 via-fuchsia-500 to-indigo-600" />

                <div className="flex items-start justify-between gap-4 mb-6">

                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-purple-500/15 border border-purple-500/30 text-purple-300">
                        Lista: {columnTitle}
                      </span>
                    </div>
                    <input
                      type="text"
                      value={card.title}
                      onChange={(e) => onUpdateCard({ ...card, title: e.target.value })}

                    />

                      <form onSubmit={handleAddChecklistItem} className="flex items-center gap-2 pt-2">

                  <div className="space-y-5">

                        />

                          <button
                            type="button"
                            onClick={() => onUpdateCard({ ...card, dueDate: null })}
                            className="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white"
                          >
                            <Icon name="x" className="w-3.5 h-3.5" />

                                <div className="truncate">
                                  <p className="text-xs font-semibold truncate">{member.name}</p>
                                  <p className="text-[10px] text-slate-400 truncate">{member.role}</p>
                                </div>
                              </div>
                              {isAssigned && (
                                <Icon name="check" className="w-4 h-4 text-purple-400 shrink-0" />
                              )}
                            </button>
                          );

                      </div>

                    {/* Etiquetas */}
                    <div className="p-4 rounded-2xl bg-[#161626] border border-white/10 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <label className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-300">
                          <Icon name="tag" className="w-4 h-4 text-purple-400" />
                          Etiquetas
                        </label>
                        <button
                          type="button"
                          onClick={() => setShowCustomLabelForm((p) => !p)}
                          className="text-[11px] font-semibold text-purple-400 hover:text-purple-300"
                        >
                          {showCustomLabelForm ? 'Fechar' : '+ Nova'}
                        </button>
                      </div>

                      {showCustomLabelForm && (
                        <form
                          onSubmit={handleAddCustomLabel}
                          className="p-2.5 rounded-xl bg-black/40 border border-purple-500/30 space-y-2"
                        >
                          <input
                            type="text"
                            value={customLabelName}
                            onChange={(e) => setCustomLabelName(e.target.value)}
                            placeholder="Nome da etiqueta..."
                            className="w-full px-2.5 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs text-white outline-none"
                          />
                          <div className="flex items-center justify-between gap-1">
                            {Object.keys(LABEL_COLOR_MAP).map((c) => (
                              <button
                                key={c}
                                type="button"
                                onClick={() => setCustomLabelColor(c)}
                                className={`w-5 h-5 rounded-full ${LABEL_COLOR_MAP[c].solid} ${
                                  customLabelColor === c ? 'ring-2 ring-white scale-110' : 'opacity-60'
                                }`}
                              />
                            ))}
                          </div>
                          <button
                            type="submit"
                            className="w-full py-1.5 rounded-lg bg-purple-600 text-white text-xs font-semibold"
                          >
                            Criar Etiqueta
                          </button>
                        </form>
                      )}

                      <div className="flex flex-wrap gap-1.5">
                        {availableLabels.map((label) => {
                          const active = card.labels.some((l) => l.id === label.id);
                          const style = LABEL_COLOR_MAP[label.color] || LABEL_COLOR_MAP.purple;
                          return (
                            <div
                              key={label.id}
                              className={`group/lbl inline-flex items-center rounded-xl text-xs font-medium border transition-all ${
                                active
                                  ? `${style.bg} ${style.text} ${style.border} ring-1 ring-purple-400/40`
                                  : 'bg-black/30 border-white/5 text-slate-400 hover:text-white'
                              }`}
                            >
                              <button
                                type="button"
                                onClick={() => toggleLabel(label)}
                                className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1"
                              >
                                <span className={`w-2 h-2 rounded-full ${style.dot}`} />
                                <span>{label.name}</span>
                              </button>
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  onDeleteLabel(label.id);
                                }}
                                title="Excluir etiqueta da lista"
                                className="pr-2 pl-0.5 py-1 opacity-50 hover:opacity-100 hover:text-rose-400 transition-opacity"
                              >
                                ×
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Excluir Cartão */}
                    <button
                      type="button"
                      onClick={() => {
                        onDeleteCard(card.id);
                        onClose();
                      }}
                      className="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/25 text-rose-300 text-xs font-semibold transition-colors"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                      <span>Excluir Cartão</span>

                  </div>
                </div>
              </motion.div>
            </div>

      // ==========================================

      // ==========================================
      function App() {
        const [boards, setBoards] = useLocalStorage('nebulaflow_boards_v1', INITIAL_BOARDS);
        const [members, setMembers] = useLocalStorage(
          'nebulaflow_members_v1',
          WORKSPACE_MEMBERS
        );
        const [availableLabels, setAvailableLabels] = useLocalStorage(
          'nebulaflow_labels_v1',
          DEFAULT_LABELS
        );
        const [bookLogs, setBookLogs] = useLocalStorage(
          'nebulaflow_book_logs_v1',
          INITIAL_BOOK_LOGS
        );
        const [bookCategories, setBookCategories] = useLocalStorage(
          'nebulaflow_book_categories_v1',
          DEFAULT_BOOK_CATEGORIES
        );
        const [bookStatuses, setBookStatuses] = useLocalStorage(
          'nebulaflow_book_statuses_v1',
          DEFAULT_BOOK_STATUSES
        );
        const [activeTab, setActiveTab] = useState('boards'); // 'boards' | 'book'
        const [isTeamModalOpen, setIsTeamModalOpen] = useState(false);
        const [activeBoardId, setActiveBoardId] = useLocalStorage(
          'nebulaflow_active_board_v1',
          INITIAL_BOARDS[0].id
        );
        const [searchQuery, setSearchQuery] = useState('');
        const [showThemeMenu, setShowThemeMenu] = useState(false);
        const [selectedCardId, setSelectedCardId] = useState(null);
        const [activeMemberFilter, setActiveMemberFilter] = useState(null);

        // Estados de listas e cartões
        const [isAddingColumn, setIsAddingColumn] = useState(false);
        const [newColumnTitle, setNewColumnTitle] = useState('');
        const [addingCardColId, setAddingCardColId] = useState(null);
        const [newCardTitle, setNewCardTitle] = useState('');
        const [editingColId, setEditingColId] = useState(null);
        const [colTitleDraft, setColTitleDraft] = useState('');

        // Estados de criação de Quadro
        const [isCreatingBoard, setIsCreatingBoard] = useState(false);
        const [newBoardTitle, setNewBoardTitle] = useState('');
        const [newBoardDesc, setNewBoardDesc] = useState('');
        const [newBoardTheme, setNewBoardTheme] = useState(BOARD_THEMES[0].id);

        // Estados de Drag and Drop Animado
        const [draggingCardId, setDraggingCardId] = useState(null);
        const [dragSourceColId, setDragSourceColId] = useState(null);
        const [dragOverColId, setDragOverColId] = useState(null);
        const [dragOverIndex, setDragOverIndex] = useState(null);

        const activeBoard = boards.find((b) => b.id === activeBoardId) || null;
        const theme =
          BOARD_THEMES.find((t) => t.id === activeBoard?.themeId) || BOARD_THEMES[0];

        const updateActiveBoard = (updated) => {
          setBoards((prev) => prev.map((b) => (b.id === updated.id ? updated : b)));
        };

        // Movimentação de Cartão (Drag and Drop)
        const handleDropCard = (targetColId, targetIndex) => {
          if (!activeBoard || !draggingCardId || !dragSourceColId) return;

          const startCol = activeBoard.columns.find((c) => c.id === dragSourceColId);
          const finishCol = activeBoard.columns.find((c) => c.id === targetColId);
          if (!startCol || !finishCol) return;

          const sourceIndex = startCol.cardIds.indexOf(draggingCardId);
          if (sourceIndex === -1) return;

          if (startCol.id === finishCol.id) {
            const newCardIds = Array.from(startCol.cardIds);
            newCardIds.splice(sourceIndex, 1);
            const adjustedIndex =
              targetIndex !== null && targetIndex <= newCardIds.length
                ? targetIndex
                : newCardIds.length;
            newCardIds.splice(adjustedIndex, 0, draggingCardId);

            updateActiveBoard({
              ...activeBoard,
              columns: activeBoard.columns.map((c) =>
                c.id === startCol.id ? { ...c, cardIds: newCardIds } : c
              ),
            });
          } else {
            const startCardIds = Array.from(startCol.cardIds);
            startCardIds.splice(sourceIndex, 1);

            const finishCardIds = Array.from(finishCol.cardIds);
            const insertAt =
              targetIndex !== null && targetIndex <= finishCardIds.length
                ? targetIndex
                : finishCardIds.length;
            finishCardIds.splice(insertAt, 0, draggingCardId);

            updateActiveBoard({
              ...activeBoard,
              columns: activeBoard.columns.map((c) => {
                if (c.id === startCol.id) return { ...c, cardIds: startCardIds };
                if (c.id === finishCol.id) return { ...c, cardIds: finishCardIds };
                return c;
              }),
            });
          }

          setDraggingCardId(null);
          setDragSourceColId(null);
          setDragOverColId(null);
          setDragOverIndex(null);
        };

        const selectedCard =
          activeBoard && selectedCardId ? activeBoard.cards[selectedCardId] : null;
        const selectedCardColumn =
          activeBoard && selectedCardId
            ? activeBoard.columns.find((c) => c.cardIds.includes(selectedCardId))?.title || ''
            : '';

        const allCards = activeBoard ? Object.values(activeBoard.cards) : [];
        const totalCheckItems = allCards.reduce((acc, c) => acc + c.checklist.length, 0);
        const completedCheckItems = allCards.reduce(
          (acc, c) => acc + c.checklist.filter((i) => i.completed).length,
          0
        );

        return (
          <div className="min-h-screen bg-[#07070b] text-slate-100 flex flex-col">
            {/* ========================================== */}
            {/* NAVBAR SUPERIOR                            */}
            {/* ========================================== */}
            <header className="sticky top-0 z-30 h-16 border-b border-purple-500/15 bg-[#090911]/85 backdrop-blur-xl px-4 lg:px-8 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 min-w-0">
                {(activeBoard || activeTab === 'book') && (
                  <motion.button
                    whileHover={{ scale: 1.03, x: -2 }}
                    whileTap={{ scale: 0.97 }}
                    onClick={() => {
                      setActiveTab('boards');
                      setActiveBoardId(null);
                      setSearchQuery('');
                    }}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/5 hover:bg-purple-500/15 border border-white/10 hover:border-purple-500/40 text-slate-200 text-sm font-medium transition-colors"
                  >
                    <Icon name="chevronLeft" className="w-4 h-4 text-purple-400" />
                    <span>Quadros</span>
                  </motion.button>
                )}

                <div
                  onClick={() => {
                    setActiveTab('boards');
                    setActiveBoardId(null);
                  }}
                  className="flex items-center gap-2.5 cursor-pointer group"
                >
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 via-violet-600 to-fuchsia-600 flex items-center justify-center shadow-glow group-hover:scale-105 transition-transform">
                    <Icon name="layers" className="w-5 h-5 text-white" />
                  </div>
                  <span className="hidden sm:inline font-bold tracking-tight text-white text-base">
                    Nebula<span className="text-purple-400">Flow</span>
                  </span>
                </div>

                {/* Botão de Navegação para o Book de Histórico */}
                <button
                  onClick={() =>
                    setActiveTab((prev) => (prev === 'book' ? 'boards' : 'book'))
                  }
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-xl border text-xs sm:text-sm font-semibold transition-all ${

                                  {columnCards.length}
                                </span>
                              </div>
                            )}

                            {editingColId !== column.id && (
                              <div className="flex items-center gap-1">
                                <button
                                  onClick={() => {
                                    setEditingColId(column.id);
                                    setColTitleDraft(column.title);
                                  }}
                                  title="Renomear lista"
                                  className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
                                >
                                  <Icon name="edit" className="w-3.5 h-3.5" />
                                </button>
                                <button
                                  onClick={() => {
                                    const remainingCards = { ...activeBoard.cards };
                                    column.cardIds.forEach((id) => delete remainingCards[id]);
                                    updateActiveBoard({
                                      ...activeBoard,
                                      columns: activeBoard.columns.filter(
                                        (c) => c.id !== column.id
                                      ),
                                      cards: remainingCards,
                                    });
                                  }}
                                  title="Excluir lista"
                                  className="p-1.5 rounded-lg text-slate-400 hover:text-rose-300 hover:bg-rose-500/15 transition-colors"
                                >
                                  <Icon name="trash" className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            )}
                          </div>

                          {/* Lista de Cartões com Drag and Drop Animado */}
                          <div className="flex-1 overflow-y-auto px-3.5 pt-3 pb-2 min-h-[130px] space-y-3">
                            {columnCards.map((card, index) => {
                              const totalCheck = card.checklist.length;
                              const doneCheck = card.checklist.filter((i) => i.completed).length;
                              const progressPct =
                                totalCheck > 0 ? Math.round((doneCheck / totalCheck) * 100) : 0;
                              const allCompleted = totalCheck > 0 && doneCheck === totalCheck;
                              const overdue = isDateOverdue(card.dueDate) && !allCompleted;
                              const assignedMembers = members.filter((m) =>
                                card.memberIds.includes(m.id)
                              );
                              const isBeingDragged = draggingCardId === card.id;

                              return (
                                <motion.div
                                  layout
                                  key={card.id}
                                  draggable
                                  onDragStart={(e) => {
                                    setDraggingCardId(card.id);
                                    setDragSourceColId(column.id);
                                    e.dataTransfer.effectAllowed = 'move';
                                  }}
                                  onDragOver={(e) => {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    setDragOverColId(column.id);
                                    setDragOverIndex(index);
                                  }}
                                  onDragEnd={() => {
                                    setDraggingCardId(null);
                                    setDragSourceColId(null);
                                    setDragOverColId(null);
                                    setDragOverIndex(null);
                                  }}
                                  onClick={() => setSelectedCardId(card.id)}
                                  whileHover={{ y: -3, scale: 1.01 }}
                                  animate={{
                                    scale: isBeingDragged ? 1.04 : 1,
                                    rotate: isBeingDragged ? 2 : 0,
                                    opacity: isBeingDragged ? 0.65 : 1,
                                  }}
                                  transition={{ type: 'spring', stiffness: 400, damping: 26 }}
                                  className={`group relative rounded-2xl p-4 cursor-grab active:cursor-grabbing border transition-colors ${
                                    isBeingDragged
                                      ? 'bg-[#1b1b2f] border-purple-400 shadow-card-drag ring-2 ring-purple-500/40'
                                      : 'bg-[#131320]/90 hover:bg-[#181828] border-white/10 hover:border-purple-500/45 shadow-md'
                                  }`}
                                >
                                  <div className="absolute inset-x-4 top-0 h-px bg-gradient-to-r from-transparent via-purple-400/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity" />

                                  {/* Etiquetas */}
                                  {card.labels.length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mb-2.5">
                                      {card.labels.map((label) => {
                                        const style =
                                          LABEL_COLOR_MAP[label.color] || LABEL_COLOR_MAP.purple;
                                        return (
                                          <span
                                            key={label.id}
                                            className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg text-[11px] font-semibold border ${style.bg} ${style.text} ${style.border}`}
                                          >
                                            <span
                                              className={`w-1.5 h-1.5 rounded-full ${style.dot}`}
                                            />
                                            {label.name}
                                          </span>
                                        );
                                      })}
                                    </div>
                                  )}

                                  {/* Título do Cartão */}
                                  <h4 className="text-sm font-semibold text-slate-100 group-hover:text-white leading-snug mb-2.5">
                                    {card.title}
                                  </h4>

                                  {/* Barra de Progresso Animada do Checklist */}
                                  {totalCheck > 0 && (
                                    <div className="mb-3 space-y-1.5">
                                      <div className="flex items-center justify-between text-[11px] text-slate-400">
                                        <span className="flex items-center gap-1 font-medium">
                                          <Icon
                                            name="checkSquare"
                                            className="w-3 h-3 text-purple-400"
                                          />
                                          Progresso
                                        </span>
                                        <span
                                          className={`font-semibold ${
                                            allCompleted ? 'text-emerald-400' : 'text-purple-300'
                                          }`}
                                        >
                                          {progressPct}%
                                        </span>
                                      </div>
                                      <div className="w-full h-1.5 rounded-full bg-white/5 overflow-hidden">
                                        <motion.div
                                          initial={false}
                                          animate={{ width: `${progressPct}%` }}
                                          transition={{
                                            type: 'spring',
                                            stiffness: 260,
                                            damping: 24,
                                          }}
                                          className={`h-full rounded-full ${
                                            allCompleted
                                              ? 'bg-gradient-to-r from-emerald-500 to-teal-400'
                                              : 'bg-gradient-to-r from-purple-500 via-violet-500 to-fuchsia-500'
                                          }`}
                                        />
                                      </div>
                                    </div>
                                  )}

                                  {/* Rodapé do Cartão: Data, Indicadores e Avatares */}
                                  <div className="flex items-center justify-between gap-2 pt-1">
                                    <div className="flex items-center flex-wrap gap-2 text-xs">
                                      {card.dueDate && (
                                        <span
                                          className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-lg border text-[11px] font-medium ${
                                            allCompleted
                                              ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                                              : overdue
                                              ? 'bg-rose-500/15 border-rose-500/30 text-rose-300'
                                              : 'bg-white/5 border-white/10 text-slate-300'
                                          }`}
                                        >
                                          <Icon name="calendar" className="w-3 h-3" />
                                          {formatShortDate(card.dueDate)}
                                        </span>
                                      )}

                                      {card.description && (
                                        <span
                                          title="Possui descrição detalhada"
                                          className="inline-flex items-center p-1 rounded-md bg-white/5 text-slate-400"
                                        >
                                          <Icon name="alignLeft" className="w-3.5 h-3.5" />
                                        </span>
                                      )}

                                      {totalCheck > 0 && (
                                        <span
                                          className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[11px] font-medium ${
                                            allCompleted
                                              ? 'bg-emerald-500/15 text-emerald-300'
                                              : 'bg-white/5 text-slate-400'
                                          }`}
                                        >
                                          {doneCheck}/{totalCheck}
                                        </span>
                                      )}
                                    </div>

                                    {assignedMembers.length > 0 && (
                                      <div className="flex items-center -space-x-2">
                                        {assignedMembers.map((member) => (
                                          <div
                                            key={member.id}
                                            title={`${member.name} (${member.role})`}
                                            className="rounded-full border-2 border-[#131320] shadow-sm"
                                          >
                                            <MemberAvatar
                                              member={member}
                                              sizeClass="w-6 h-6 text-[10px]"
                                            />
                                          </div>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                </motion.div>
                              );
                            })}

                            {columnCards.length === 0 && (
                              <div className="h-24 rounded-2xl border border-dashed border-white/10 flex flex-col items-center justify-center text-center p-3 text-xs text-slate-500">
                                Arraste um cartão para cá ou crie um novo abaixo
                              </div>
                            )}
                          </div>

                          {/* Rodapé da Coluna: Criar Novo Cartão */}
                          <div className="p-3 pt-2 border-t border-white/5">
                            {addingCardColId === column.id ? (
                              <form
                                onSubmit={(e) => {
                                  e.preventDefault();
                                  if (!newCardTitle.trim()) return;
                                  const newCardId = `card-${Date.now()}`;
                                  const newCard = {
                                    id: newCardId,
                                    title: newCardTitle.trim(),
                                    description: '',
                                    labels: [DEFAULT_LABELS[1]],
                                    dueDate: null,
                                    checklist: [],
                                    memberIds: activeMemberFilter
                                      ? [activeMemberFilter]
                                      : ['mem-1'],
                                  };
                                  updateActiveBoard({
                                    ...activeBoard,
                                    columns: activeBoard.columns.map((c) =>
                                      c.id === column.id
                                        ? { ...c, cardIds: [...c.cardIds, newCardId] }
                                        : c
                                    ),
                                    cards: { ...activeBoard.cards, [newCardId]: newCard },
                                  });
                                  setNewCardTitle('');
                                  setAddingCardColId(null);
                                }}
                                className="space-y-2.5"
                              >
                                <textarea
                                  rows={2}
                                  autoFocus
                                  value={newCardTitle}
                                  onChange={(e) => setNewCardTitle(e.target.value)}
                                  onKeyDown={(e) => {
                                    if (e.key === 'Enter' && !e.shiftKey) {
                                      e.preventDefault();
                                      e.target.form.requestSubmit();
                                    }
                                    if (e.key === 'Escape') setAddingCardColId(null);
                                  }}
                                  placeholder="Digite o título do cartão..."
                                  className="w-full px-3 py-2 rounded-xl bg-[#161625] border border-purple-500/50 text-sm text-white placeholder-slate-400 outline-none resize-none"
                                />
                                <div className="flex items-center justify-between gap-2">
                                  <button
                                    type="submit"
                                    className="flex-1 py-1.5 px-3 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-semibold shadow-glow"
                                  >
                                    Adicionar Cartão
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => setAddingCardColId(null)}
                                    className="p-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white"
                                  >
                                    <Icon name="x" className="w-4 h-4" />
                                  </button>
                                </div>
                              </form>
                            ) : (
                              <button
                                onClick={() => setAddingCardColId(column.id)}
                                className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-white/5 hover:bg-purple-500/15 border border-white/5 hover:border-purple-500/30 text-slate-300 hover:text-purple-200 text-xs font-semibold transition-all"
                              >
                                <Icon name="plus" className="w-4 h-4 text-purple-400" />
                                <span>Novo Cartão</span>
                              </button>
                            )}
                          </div>
                        </motion.div>
                      );
                    })}

                    {/* Botão / Formulário de Nova Lista */}
                    <div className="w-80 shrink-0">
                      {isAddingColumn ? (
                        <form
                          onSubmit={(e) => {
                            e.preventDefault();
                            if (!newColumnTitle.trim()) return;
                            updateActiveBoard({
                              ...activeBoard,
                              columns: [
                                ...activeBoard.columns,
                                {
                                  id: `col-${Date.now()}`,
                                  title: newColumnTitle.trim(),
                                  cardIds: [],
                                },
                              ],
                            });
                            setNewColumnTitle('');
                            setIsAddingColumn(false);
                          }}
                          className="p-4 rounded-3xl bg-[#0d0d17]/90 backdrop-blur-xl border border-purple-500/40 shadow-glow space-y-3"
                        >
                          <input
                            type="text"
                            autoFocus
                            value={newColumnTitle}
                            onChange={(e) => setNewColumnTitle(e.target.value)}
                            placeholder="Título da lista (ex: Homologação)"
                            className="w-full px-3.5 py-2 rounded-xl bg-white/5 border border-white/10 focus:border-purple-500 text-sm text-white placeholder-slate-400 outline-none"
                          />
                          <div className="flex items-center gap-2">
                            <button
                              type="submit"
                              className="flex-1 py-2 px-4 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-semibold shadow-glow"
                            >
                              Criar Lista
                            </button>
                            <button
                              type="button"
                              onClick={() => setIsAddingColumn(false)}
                              className="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white"
                            >
                              <Icon name="x" className="w-4 h-4" />
                            </button>
                          </div>
                        </form>
                      ) : (
                        <motion.button
                          whileHover={{ scale: 1.02, y: -2 }}
                          whileTap={{ scale: 0.98 }}
                          onClick={() => setIsAddingColumn(true)}
                          className="w-full py-3.5 px-4 rounded-3xl border-2 border-dashed border-purple-500/30 hover:border-purple-400/60 bg-purple-950/15 hover:bg-purple-950/30 backdrop-blur-md flex items-center justify-center gap-2 text-purple-200 font-semibold text-sm transition-all shadow-lg"
                        >
                          <Icon name="plus" className="w-4 h-4 text-purple-400" />
                          <span>Adicionar Nova Lista</span>
                        </motion.button>
                      )}
                    </div>
                  </div>
                </div>

                {/* Modal de Detalhes do Cartão */}
                <CardModal
                  card={selectedCard}
                  columnTitle={selectedCardColumn}
                  members={members}
                  availableLabels={availableLabels}
                  onCreateLabel={(newLbl) =>
                    setAvailableLabels((prev) => [...prev, newLbl])
                  }
                  onDeleteLabel={(lblId) => {
                    setAvailableLabels((prev) => prev.filter((l) => l.id !== lblId));
                    const updatedCards = { ...activeBoard.cards };
                    Object.keys(updatedCards).forEach((cid) => {
                      updatedCards[cid] = {
                        ...updatedCards[cid],
                        labels: updatedCards[cid].labels.filter((l) => l.id !== lblId),
                      };
                    });
                    updateActiveBoard({ ...activeBoard, cards: updatedCards });
                  }}
                  onOpenTeamModal={() => setIsTeamModalOpen(true)}
                  onClose={() => setSelectedCardId(null)}
                  onUpdateCard={(updatedCard) =>
                    updateActiveBoard({
                      ...activeBoard,
                      cards: { ...activeBoard.cards, [updatedCard.id]: updatedCard },
                    })
                  }
                  onDeleteCard={(cardId) => {
                    const remaining = { ...activeBoard.cards };
                    delete remaining[cardId];
                    updateActiveBoard({
                      ...activeBoard,
                      columns: activeBoard.columns.map((c) => ({
                        ...c,
                        cardIds: c.cardIds.filter((id) => id !== cardId),
                      })),
                      cards: remaining,
                    });
                  }}
                />
              </div>
            )}

            {/* Modal Global de Gerenciamento de Membros */}
            <TeamModal
              isOpen={isTeamModalOpen}
              onClose={() => setIsTeamModalOpen(false)}
              members={members}
              onAddMember={(newMember) => setMembers((prev) => [...prev, newMember])}
              onRemoveMember={(memberId) => {
                setMembers((prev) => prev.filter((m) => m.id !== memberId));
                if (activeMemberFilter === memberId) setActiveMemberFilter(null);
              }}
            />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
